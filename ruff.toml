# Explicit rules, so the gate cannot change under us: ruff's defaults widened
# between releases and turned a green repo red without a code change.
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I"]   # real errors plus import order
ignore = ["E501"]                        # line length is enforced by the formatter

[format]
quote-style = "double"
